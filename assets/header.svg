<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Zé Filho — Porter da Rede Quiral, desenvolvedor full stack em formação">
  <defs>
    <radialGradient id="sky" cx="50%" cy="110%" r="90%">
      <stop offset="0%" stop-color="#3a2408"/>
      <stop offset="35%" stop-color="#140f0a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffcf6b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip"><rect class="typer" x="340" y="232" width="0" height="34"/></clipPath>
    <style>
      text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .title{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:14px}
      .hud{fill:#5ce1e6;font-size:13px;letter-spacing:2px;opacity:.85}
      .dim{fill:#8a7a62;font-size:12px;letter-spacing:3px}
      .rain{stroke:#9fb4c4;stroke-width:1.2;opacity:.35;animation:fall 1.6s linear infinite}
      @keyframes fall{from{transform:translate(0,-80px)}to{transform:translate(-60px,460px)}}
      .dust{fill:#f5a623;animation:float 9s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-18px);opacity:.9}}
      .strand{fill:none;stroke:#f5a623;stroke-width:1.4;stroke-dasharray:6 10;animation:flow 3s linear infinite;opacity:.7}
      @keyframes flow{to{stroke-dashoffset:-64}}
      .node{fill:#ffd27a;animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{r:3;opacity:.6}50%{r:6;opacity:1}}
      .ring{fill:none;stroke:#f5a623;animation:ring 3s ease-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(3.2);opacity:0}}
      .glitchA{fill:#5ce1e6;opacity:.55;animation:gA 4s steps(1) infinite}
      .glitchB{fill:#ff4d6d;opacity:.45;animation:gB 4s steps(1) infinite}
      @keyframes gA{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(-5px,2px)}93%{transform:translate(4px,-1px)}95%{transform:translate(-2px,0)}}
      @keyframes gB{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(5px,-2px)}93%{transform:translate(-4px,1px)}95%{transform:translate(2px,0)}}
      .typer{animation:type 3.2s steps(34) 1s forwards}
      @keyframes type{to{width:610px}}
      .caret{fill:#f5a623;animation:blink 1s steps(1) infinite,caretmove 3.2s steps(34) 1s both}
      @keyframes caretmove{from{transform:translateX(-530px)}to{transform:translateX(0)}}
      @keyframes blink{50%{opacity:0}}
      .porter{animation:walk 38s linear infinite}
      @keyframes walk{from{transform:translateX(-80px)}to{transform:translateX(1280px)}}
      .bob{animation:bob .9s ease-in-out infinite}
      @keyframes bob{50%{transform:translateY(-2px)}}
      .boot{opacity:0;animation:appear .3s forwards}
      @keyframes appear{to{opacity:1}}
      .scan{fill:url(#gold);opacity:.06;animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(440px)}}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- poeira quiral -->
  <g>
    <circle class="dust" cx="80" cy="90" r="1.6" style="animation-delay:-1s"/>
    <circle class="dust" cx="190" cy="160" r="1.2" style="animation-delay:-3s"/>
    <circle class="dust" cx="260" cy="60" r="2" style="animation-delay:-5s"/>
    <circle class="dust" cx="400" cy="120" r="1.3" style="animation-delay:-2s"/>
    <circle class="dust" cx="520" cy="40" r="1.8" style="animation-delay:-7s"/>
    <circle class="dust" cx="650" cy="80" r="1.1" style="animation-delay:-4s"/>
    <circle class="dust" cx="760" cy="150" r="1.7" style="animation-delay:-6s"/>
    <circle class="dust" cx="880" cy="70" r="1.4" style="animation-delay:-8s"/>
    <circle class="dust" cx="990" cy="130" r="2" style="animation-delay:-2.5s"/>
    <circle class="dust" cx="1110" cy="60" r="1.3" style="animation-delay:-5.5s"/>
    <circle class="dust" cx="1150" cy="180" r="1.6" style="animation-delay:-1.5s"/>
    <circle class="dust" cx="40" cy="220" r="1.2" style="animation-delay:-6.5s"/>
  </g>

  <!-- rede quiral: nós e fios -->
  <path class="strand" d="M60 330 C 220 250, 300 360, 430 300 S 640 250, 760 310 S 1000 360, 1140 290"/>
  <path class="strand" style="animation-duration:4.5s;opacity:.35" d="M30 360 C 200 320, 380 390, 560 350 S 900 300, 1170 350"/>
  <g>
    <circle class="node" cx="60" cy="330" r="4"/>
    <circle class="node" cx="430" cy="300" r="4" style="animation-delay:-.6s"/>
    <circle class="node" cx="760" cy="310" r="4" style="animation-delay:-1.2s"/>
    <circle class="node" cx="1140" cy="290" r="4" style="animation-delay:-1.8s"/>
    <circle class="ring" cx="430" cy="300" r="8" stroke-width="1"/>
    <circle class="ring" cx="1140" cy="290" r="8" stroke-width="1" style="animation-delay:-1.5s"/>
  </g>

  <!-- horizonte -->
  <path d="M0 372 L140 352 L260 366 L380 340 L520 362 L640 348 L800 366 L940 344 L1060 360 L1200 350 L1200 420 L0 420 Z" fill="url(#ground)"/>
  <path d="M0 372 L140 352 L260 366 L380 340 L520 362 L640 348 L800 366 L940 344 L1060 360 L1200 350" fill="none" stroke="#f5a623" stroke-opacity=".35"/>

  <!-- porter caminhando com a carga -->
  <g class="porter">
    <g class="bob" transform="translate(0,318)">
      <rect x="-9" y="-30" width="18" height="12" rx="1.5" fill="#c48a1c"/>
      <rect x="-7" y="-41" width="14" height="11" rx="1.5" fill="#f5a623"/>
      <rect x="-5" y="-50" width="10" height="9" rx="1.5" fill="#ffd27a"/>
      <circle cx="4" cy="-12" r="4" fill="#cfd8dc"/>
      <path d="M2 -8 L4 10 M4 10 L-1 22 M4 10 L9 22 M3 -2 L12 6" stroke="#cfd8dc" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <circle cx="14" cy="4" r="2.6" fill="#5ce1e6" filter="url(#glow)"/>
    </g>
  </g>

  <!-- timefall -->
  <g>
    <line class="rain" x1="120" y1="0" x2="110" y2="22"/>
    <line class="rain" x1="300" y1="0" x2="290" y2="22" style="animation-delay:-.4s"/>
    <line class="rain" x1="470" y1="0" x2="460" y2="22" style="animation-delay:-1.1s"/>
    <line class="rain" x1="610" y1="0" x2="600" y2="22" style="animation-delay:-.7s"/>
    <line class="rain" x1="720" y1="0" x2="710" y2="22" style="animation-delay:-1.4s"/>
    <line class="rain" x1="860" y1="0" x2="850" y2="22" style="animation-delay:-.2s"/>
    <line class="rain" x1="1010" y1="0" x2="1000" y2="22" style="animation-delay:-.9s"/>
    <line class="rain" x1="1150" y1="0" x2="1140" y2="22" style="animation-delay:-1.2s"/>
    <line class="rain" x1="1250" y1="0" x2="1240" y2="22" style="animation-delay:-.5s"/>
  </g>

  <rect class="scan" x="0" y="0" width="1200" height="40"/>

  <!-- molduras HUD -->
  <g stroke="#f5a623" stroke-width="2" fill="none" opacity=".8">
    <path d="M24 56 V24 H56"/><path d="M1144 24 H1176 V56"/>
    <path d="M24 364 V396 H56"/><path d="M1176 364 V396 H1144"/>
  </g>

  <g>
    <text class="hud boot" x="48" y="48" style="animation-delay:.1s">▲ DRAWBRIDGE // CHIRAL NETWORK</text>
    <text class="hud boot" x="1152" y="48" text-anchor="end" style="animation-delay:.4s">LINK ESTÁVEL ● 99.9%</text>
    <text class="dim boot" x="48" y="390" style="animation-delay:.7s">NÓ DE ORIGEM: VITÓRIA DA CONQUISTA · BA</text>
    <text class="dim boot" x="1152" y="390" text-anchor="end" style="animation-delay:1s">PORTER ID: TEPANNIAKY</text>
  </g>

  <!-- título com glitch -->
  <g text-anchor="middle">
    <text class="title glitchA" x="600" y="196" font-size="92">ZÉ FILHO</text>
    <text class="title glitchB" x="600" y="196" font-size="92">ZÉ FILHO</text>
    <text class="title" x="600" y="196" font-size="92" fill="url(#gold)" filter="url(#glow)">ZÉ FILHO</text>
  </g>

  <!-- subtítulo digitado -->
  <g clip-path="url(#typeClip)">
    <text x="340" y="258" font-size="22" fill="#e8e2d6" letter-spacing="2">&gt; PORTER // FULL STACK EM FORMAÇÃO</text>
  </g>
  <rect class="caret" x="872" y="238" width="11" height="24"/>
</svg>
