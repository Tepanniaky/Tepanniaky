<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Previsão de timefall: risco BAIXO, 28.2 graus, 0% de chuva">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1218"/><stop offset="1" stop-color="#07090c"/></linearGradient>
    <style>
      text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .r{stroke:#9fb4c4;stroke-width:1.2;opacity:.35;animation:fall 1.4s linear infinite}
      @keyframes fall{from{transform:translate(0,-30px)}to{transform:translate(-40px,170px)}}
      .k{fill:#5ce1e6;font-size:10px;letter-spacing:3px}
      .big{fill:#f3ede2;font-size:34px;font-weight:800;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .lbl{fill:#8a7a62;font-size:10px;letter-spacing:2px}
      .v{fill:#e8e2d6;font-size:12px}
      .risk{fill:#5ce1e6;font-size:22px;font-weight:800;letter-spacing:4px;animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.55}}
    </style>
    <clipPath id="c"><rect width="840" height="150" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)"><rect width="840" height="150" fill="url(#bg)"/><line class="r" x1="0" y1="0" x2="-8" y2="18" style="animation-delay:-0.00s"/><line class="r" x1="53" y1="0" x2="45" y2="18" style="animation-delay:-0.37s"/><line class="r" x1="106" y1="0" x2="98" y2="18" style="animation-delay:-0.74s"/><line class="r" x1="159" y1="0" x2="151" y2="18" style="animation-delay:-1.11s"/><line class="r" x1="212" y1="0" x2="204" y2="18" style="animation-delay:-0.08s"/><line class="r" x1="265" y1="0" x2="257" y2="18" style="animation-delay:-0.45s"/></g>
  <rect x=".5" y=".5" width="839" height="149" rx="12" fill="none" stroke="#1f2a36"/>
  <text x="28" y="34" class="k">☂ PREVISÃO DE TIMEFALL · VITÓRIA DA CONQUISTA</text>
  <text x="28" y="82" class="big">28°C</text>
  <text x="130" y="66" class="v">CÉU LIMPO</text>
  <text x="130" y="86" class="lbl">VENTO 12 KM/H · CHUVA 0%</text>
  <text x="28" y="122" class="v">» Rota livre. Bom dia para fazer deploy.</text>
  <text x="812" y="34" class="lbl" text-anchor="end">RISCO DE TIMEFALL</text>
  <text x="812" y="72" class="risk" text-anchor="end">BAIXO</text>
  <text x="812" y="122" class="lbl" text-anchor="end" style="font-size:8.5px">ATUALIZADO 25/11 15:52 BRT · OPEN-METEO</text>
</svg>
