<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img" aria-label="divisória — fio quiral">
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f5a623" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      .pulse{animation:run 3.5s cubic-bezier(.6,0,.4,1) infinite}
      @keyframes run{from{transform:translateX(-60px)}to{transform:translateX(1260px)}}
      .knot{fill:#05070a;stroke:#f5a623;stroke-width:1.5;animation:k 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes k{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(1.25)}}
    </style>
  </defs>
  <path d="M0 20 Q 300 8 600 20 T 1200 20" fill="none" stroke="url(#fade)" stroke-width="1.5"/>
  <path d="M0 20 Q 300 32 600 20 T 1200 20" fill="none" stroke="url(#fade)" stroke-width="1" opacity=".5"/>
  <g class="pulse"><circle cx="0" cy="20" r="7" fill="#ffd27a" filter="url(#g)"/><circle cx="0" cy="20" r="2.5" fill="#fff"/></g>
  <rect class="knot" x="592" y="12" width="16" height="16"/>
</svg>
