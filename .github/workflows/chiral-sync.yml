name: Chiral Sync

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 06:00 em Vitória da Conquista
  workflow_dispatch:       # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/chiral-sync.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar com a Rede Quiral
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/chiral_sync.py

      - name: Commit da entrega
        run: |
          git config user.name "chiral-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          git diff --staged --quiet || git commit -m "📡 chiral sync: entrega atualizada"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/chiral-snake.svg?color_snake=#c48a1c&color_dots=#ebedf0,#ffe7b3,#ffd27a,#f5a623,#c48a1c
            dist/chiral-snake-dark.svg?palette=github-dark&color_snake=#5ce1e6&color_dots=#161b22,#3b2a0a,#7a5410,#c48a1c,#f5a623

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
